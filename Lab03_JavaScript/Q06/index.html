<body>
<script>
  let arr = [5, 3, 8, 1];
  arr.push(10);                       // add end
  arr.pop();                          // remove end
  arr.unshift(0);                     // add start
  arr.shift();                        // remove start
  arr.sort((x, y) => x - y);          // sort ascending
  let doubled = arr.map(x => x * 2);
  let evens = arr.filter(x => x % 2 === 0);
  console.log(arr, doubled, evens);
</script>
</body>
