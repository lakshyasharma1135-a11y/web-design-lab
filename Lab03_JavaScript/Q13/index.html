<body>
<script>
  function createCounter() {
    let count = 0;                      // private variable
    return {
      increment: () => ++count,
      decrement: () => --count,
      value: () => count
    };
  }
  const c = createCounter();
  c.increment(); c.increment(); c.decrement();
  console.log(c.value());               // 1
  console.log(c.count);                 // undefined (not accessible from outside)
</script>
</body>
