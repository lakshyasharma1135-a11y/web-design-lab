<body>
<script>
  function greet(name, callback) {
    console.log("Hello " + name);
    callback();
  }
  greet("Amit", () => console.log("Callback executed"));

  console.log("Start");
  setTimeout(() => console.log("Runs after 2 seconds"), 2000);
  console.log("End");
  // Output order: Start, End, (after 2 sec) Runs after 2 seconds
</script>
</body>
