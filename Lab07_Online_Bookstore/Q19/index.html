<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookNest — Bootstrap Styling Demo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3"><a class="navbar-brand" href="#">BookNest</a><span class="navbar-text text-white">Online Bookstore</span></nav>
<main class="container py-4"><h1 class="mb-4">Featured Books</h1><div class="row g-3">
<div class="col-sm-6 col-md-4"><div class="card h-100"><img class="card-img-top" src="images/sample.svg" alt="Sample book cover"><div class="card-body"><h2 class="h5 card-title">Clean Code</h2><p class="card-text">Robert C. Martin</p><p class="fw-bold">₹550</p><a class="btn btn-primary" href="#">View details</a></div></div></div>
<div class="col-sm-6 col-md-4"><div class="card h-100"><img class="card-img-top" src="images/sample.svg" alt="Sample book cover"><div class="card-body"><h2 class="h5 card-title">The Alchemist</h2><p class="card-text">Paulo Coelho</p><p class="fw-bold">₹299</p><a class="btn btn-primary" href="#">View details</a></div></div></div>
<div class="col-sm-6 col-md-4"><div class="card h-100"><img class="card-img-top" src="images/sample.svg" alt="Sample book cover"><div class="card-body"><h2 class="h5 card-title">A Brief History of Time</h2><p class="card-text">Stephen Hawking</p><p class="fw-bold">₹399</p><a class="btn btn-primary" href="#">View details</a></div></div></div>
</div><h2 class="h4 mt-4">Newsletter</h2><form class="row g-2"><div class="col-sm-8"><label class="visually-hidden" for="email">Email</label><input id="email" type="email" class="form-control" placeholder="Email address" required></div><div class="col-sm-4"><button class="btn btn-success w-100" type="submit">Subscribe</button></div></form></main>
</body></html>
