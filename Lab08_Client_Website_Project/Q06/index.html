<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crumb &amp; Co. — Product Carousel</title><link rel="stylesheet" href="style.css">
  <style>body{font-family:Arial,sans-serif;margin:0}h1{text-align:center}.slide{width:100%;box-sizing:border-box}.slide img{display:block;width:100%;height:55vh;object-fit:cover}.slide p{font-size:1.2rem;text-align:center}.active{display:block}#hero{position:relative}#hero button{position:absolute;top:40%;padding:.5rem 1rem;font-size:2rem}#prev{left:1rem}#next{right:1rem}</style>
</head>
<body>
  <h1>Crumb &amp; Co. — Freshly Baked</h1>
  <section id="hero" aria-label="Featured products">
    <div class="slides">
      <div class="slide active"><img src="images/sample.svg" alt="Fresh croissants"><p>Flaky croissants, baked at dawn</p></div>
      <div class="slide"><img src="images/sample.svg" alt="Decorated birthday cake"><p>Custom cakes for every occasion</p></div>
      <div class="slide"><img src="images/sample.svg" alt="Assorted cookies"><p>Cookies made with real butter</p></div>
    </div>
    <button id="prev" aria-label="Previous slide">&lsaquo;</button>
    <button id="next" aria-label="Next slide">&rsaquo;</button>
  </section>
  <script src="js/main.js"></script>
</body>
</html>
