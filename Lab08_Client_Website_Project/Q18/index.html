<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer Reviews — Crumb &amp; Co.</title><link rel="stylesheet" href="style.css">
<style>body{font-family:Arial,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem}.tgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}blockquote{background:#fff4e7;padding:16px;border-radius:8px;margin:0;box-shadow:0 2px 6px #0002}.star{font-size:2rem;cursor:pointer;color:#999;background:none;border:0}.star.on{color:#f5a623}</style>
</head><body>
<section id="reviews"><h1>What Customers Say</h1>
  <div class="tgrid">
    <blockquote><p>The sourdough is the best in town!</p><footer>Riya <span class="stars" data-r="5"></span></footer></blockquote>
    <blockquote><p>Lovely birthday cake, on time.</p><footer>Amit <span class="stars" data-r="4"></span></footer></blockquote>
    <blockquote><p>Cozy place and friendly staff.</p><footer>Sana <span class="stars" data-r="5"></span></footer></blockquote>
  </div>
  <h2>Rate us</h2><div id="rate" role="radiogroup" aria-label="Rate your experience"></div><p id="rmsg" aria-live="polite"></p>
</section><script src="script.js"></script></body></html>
